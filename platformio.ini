; ESP32-2432S028R "Cheap Yellow Display" -> WLED on/off controller

[platformio]
default_envs = cyd

[env:cyd]
; Versions are pinned exactly so builds are reproducible
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Reported to the browser flasher; must match the name in its manifest.json
custom_firmware_name = WLED CYD Lightswitch

; embed_config: embeds config.json (if present) as the default settings
; version: firmware name and version from git
; merge_bin: "mergebin" target producing a single image for web flashing
extra_scripts =
    pre:scripts/embed_config.py
    pre:scripts/version.py
    post:scripts/merge_bin.py

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3

; TFT_eSPI is configured here instead of editing its User_Setup.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; Don't freeze the UI for 5s each time an offline light is retried
    -DWEBSOCKETS_TCP_TIMEOUT=1500

; Distributable build used by `cyd release` and CI: identical firmware, but it
; never embeds config.json (see scripts/embed_config.py)
[env:release]
extends = env:cyd
